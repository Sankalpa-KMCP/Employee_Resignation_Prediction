# ============================================================
# Model Configuration: TabNet Classifier (Member 6)
# ============================================================
model:
  name: "TabNet"
  model_id: "tabnet"
  member: "Member 6"
  algorithm_family: "Attentive Interpretable Tabular Deep Learning"
  implementation: "pytorch_tabnet.tab_model.TabNetClassifier"

# ------------------------------------------------------------
# Reproducibility & Environment
# ------------------------------------------------------------
reproducibility:
  seed: 42
  device_name: "auto" # CUDA if available, else CPU
  verbose: 0

# ------------------------------------------------------------
# Fixed Parameters (Baseline Defaults)
# ------------------------------------------------------------
fixed_params:
  seed: 42
  verbose: 0
  optimizer_fn: "torch.optim.Adam"
  mask_type: "sparsemax" # or "entmax"

# ------------------------------------------------------------
# Cross-Validation & Early Stopping Strategy
# ------------------------------------------------------------
validation:
  cv_folds: 5
  patience: 20
  batch_size: 1024
  virtual_batch_size: 128
  max_epochs: 100
  validation_fraction_inner: 0.15

# ------------------------------------------------------------
# Bounded Hyperparameter Search Space
# ------------------------------------------------------------
search_space:
  n_d:
    type: "int"
    low: 8
    high: 64
    step: 8
    default: 16
  n_a:
    type: "int"
    low: 8
    high: 64
    step: 8
    default: 16
  n_steps:
    type: "int"
    low: 3
    high: 7
    step: 1
    default: 4
  gamma:
    type: "float"
    low: 1.0
    high: 2.0
    step: 0.2
    default: 1.3
  lambda_sparse:
    type: "float"
    low: 0.0001
    high: 0.01
    log: true
    default: 0.001
  learning_rate:
    type: "float"
    low: 0.005
    high: 0.05
    log: true
    default: 0.02
  # TODO: Refine parameter ranges during dedicated hyperparameter tuning stage
