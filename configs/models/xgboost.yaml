# ============================================================
# Model Configuration: XGBoost Classifier (Member 3)
# ============================================================
model:
  name: "XGBoost"
  model_id: "xgboost"
  member: "Member 3"
  algorithm_family: "Extreme Gradient Boosting"
  implementation: "xgboost.XGBClassifier"

# ------------------------------------------------------------
# Reproducibility & Environment
# ------------------------------------------------------------
reproducibility:
  random_seed: 42
  n_jobs: -1
  tree_method: "hist"

# ------------------------------------------------------------
# Fixed Parameters (Baseline Defaults)
# ------------------------------------------------------------
fixed_params:
  objective: "binary:logistic"
  eval_metric: "aucpr"
  random_state: 42
  tree_method: "hist"
  verbosity: 0

# ------------------------------------------------------------
# Cross-Validation & Early Stopping Strategy
# ------------------------------------------------------------
validation:
  cv_folds: 5
  early_stopping_rounds: 50
  validation_fraction_inner: 0.15

# ------------------------------------------------------------
# Bounded Hyperparameter Search Space
# ------------------------------------------------------------
search_space:
  n_estimators:
    type: "int"
    low: 200
    high: 800
    step: 100
    default: 400
  learning_rate:
    type: "float"
    low: 0.01
    high: 0.2
    log: true
    default: 0.05
  max_depth:
    type: "int"
    low: 3
    high: 8
    step: 1
    default: 5
  subsample:
    type: "float"
    low: 0.6
    high: 1.0
    step: 0.1
    default: 0.8
  colsample_bytree:
    type: "float"
    low: 0.6
    high: 1.0
    step: 0.1
    default: 0.8
  reg_alpha:
    type: "float"
    low: 0.0
    high: 5.0
    default: 0.1
  reg_lambda:
    type: "float"
    low: 1.0
    high: 10.0
    default: 1.0

# ------------------------------------------------------------
# Formal Nested Candidate Registry (executed in upgraded package)
# ------------------------------------------------------------
formal_candidates:
  XGB01: {n_estimators: 400, learning_rate: 0.05, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB02: {n_estimators: 500, learning_rate: 0.05, max_depth: 3, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB03: {n_estimators: 400, learning_rate: 0.05, max_depth: 7, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB04: {n_estimators: 700, learning_rate: 0.02, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB05: {n_estimators: 300, learning_rate: 0.10, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB06: {n_estimators: 500, learning_rate: 0.05, max_depth: 5, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 1.0, reg_lambda: 5.0}
  XGB07: {n_estimators: 500, learning_rate: 0.05, max_depth: 5, subsample: 0.7, colsample_bytree: 0.7, reg_alpha: 0.1, reg_lambda: 1.0}
  XGB08: {n_estimators: 600, learning_rate: 0.03, max_depth: 4, subsample: 0.8, colsample_bytree: 0.8, reg_alpha: 0.5, reg_lambda: 5.0}
formal_tuning:
  status: completed
  selection_metric: average_precision
  outer_folds: 5
  inner_validation_fraction: 0.15
  class_weighting: fold-local scale_pos_weight
  artefact_dir: results/models/xgboost/strict_nested
