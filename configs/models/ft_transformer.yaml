# ============================================================
# Model Configuration: FT-Transformer (Member 1)
# ============================================================
model:
  name: "FT-Transformer"
  model_id: "ft_transformer"
  member: "Member 1"
  algorithm_family: "Feature Tokenizer Transformer for Tabular Data"
  implementation: "rtdl_revisiting_models.FTTransformer"

# ------------------------------------------------------------
# Reproducibility & Environment
# ------------------------------------------------------------
reproducibility:
  seed: 42
  device: "auto" # CUDA if available, else CPU

# ------------------------------------------------------------
# Fixed Parameters (Baseline Defaults)
# ------------------------------------------------------------
fixed_params:
  seed: 42
  n_blocks: 3
  d_block: 64
  attention_n_heads: 4
  ffn_d_hidden: 128
  ffn_dropout: 0.1
  attention_dropout: 0.1
  residual_dropout: 0.0

# ------------------------------------------------------------
# Cross-Validation & Optimization Strategy
# ------------------------------------------------------------
validation:
  cv_folds: 5
  batch_size: 512
  max_epochs: 100
  patience: 15
  lr_scheduler: "ReduceLROnPlateau"
  validation_fraction_inner: 0.15

# ------------------------------------------------------------
# Bounded Hyperparameter Search Space
# ------------------------------------------------------------
search_space:
  n_blocks:
    type: "int"
    low: 2
    high: 6
    step: 1
    default: 3
  d_block:
    type: "int"
    low: 32
    high: 128
    step: 32
    default: 64
  attention_n_heads:
    type: "int"
    low: 2
    high: 8
    step: 2
    default: 4
  ffn_d_hidden_multiplier:
    type: "float"
    low: 1.0
    high: 4.0
    step: 0.5
    default: 2.0
  learning_rate:
    type: "float"
    low: 0.0001
    high: 0.005
    log: true
    default: 0.001
  weight_decay:
    type: "float"
    low: 1e-6
    high: 1e-3
    log: true
    default: 1e-5
  # TODO: Refine parameter ranges during dedicated hyperparameter tuning stage
